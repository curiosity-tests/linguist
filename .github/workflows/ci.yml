name: Run Tests

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Run Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  regex-compatibility:
    name: Regex data compatibility
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: false
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check regex compatibility
      run: script/check-regex-compatibility

  run:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '4.0', '3.4', '3.3' ]
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        # Upstream pins actions/checkout@v1 on THIS job only: v1 is shell-based and
        # leaves a detached HEAD, so the step below can run
        #   git fetch origin main:main ...
        # legally. action-checkout does the v4-style `checkout -B main`, which makes
        # refs/heads/main the checked-out branch and the fetch then fails with
        # 'refusing to fetch into branch'. A full SHA restores the detached HEAD.
        ref: ${{ github.sha }}
        # racecar: full history. action-checkout defaults to a depth-1 clone, but
        # `Fetch grammar submodules` fetches named refs and the test suite walks
        # history through Rugged, which then fails with
        #   Rugged::OdbError: object not found - no match for id (7dbcffcf...)
        # fetch-depth changes how much history is present, not what is built.
        fetch-depth: 0
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Fetch grammar submodules
      run: |
        git fetch origin main:main v2.0.0:v2.0.0 test/attributes:test/attributes test/master:test/master
        sed -i 's|git@github.com:|https://github.com/|' .gitmodules
        git submodule init
        git submodule sync --quiet
        script/fast-submodule-update
    - name: Run tests
      run: bundle exec rake
    - name: Check Licenses
      run: bundle exec licensed status -c vendor/licenses/config.yml
  dockerfile:
    name: Test Dockerfile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Build container
      run: docker build -t linguist .
    - name: Analyse current directory
      run: docker run --rm -v $(pwd):$(pwd) -w $(pwd) --user $(id -u) -t linguist | tee output
    - name: Confirm analysis
      run: grep Ruby output
  classifier:
    name: Classifier cross-validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Build
      run: bundle exec rake samples
    - name: Run cross-validation
      run: bundle exec script/cross-validation --test 2>&1
